# "dev" App Configuration settings, imported under the "ai-utils-lib/"
# prefix with label "dev". They override src/ai_utils_lib/config.yaml.

foundry:
    project_endpoint: "https://dummyurl.change.it/foundry"
    agent_name: "dummy-agent-name"

mcp:
    calculator:
        url: "http://127.0.0.1:8080/mcp"

model:
    api_style: "responses"
    base_url: "https://dummyurl.change.it/v1"
    name: "dummy-model-name"
    api_key_env: "NVIDIA_API_KEY"
    instructions: >-
        Dummy system instructions for the model.  Change it to your own instructions.
    is_stateful: false
    max_concurrent_prompts: 10
    temperature: 1.0
    timeout_seconds: 30